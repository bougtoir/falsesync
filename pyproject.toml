[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falsesync"
version = "0.1.1"
description = "Aggregation-induced false synchrony: estimands, diagnostics, and simulation for change-point analysis on aggregated panels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tatsuki Onishi" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "pyyaml>=6",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24"]
cp = ["ruptures>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
