[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falsesync"
version = "0.1.2"
description = "Aggregation-induced false synchrony: estimands, diagnostics, and simulation for change-point analysis on aggregated panels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tatsuki Onishi" }]
keywords = ["change-point analysis", "aggregation", "synchrony", "panel time series", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0,<2.4",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "pyyaml>=6",
    "scikit-learn>=1.5,<1.8",
]

[project.urls]
Homepage = "https://github.com/bougtoir/falsesync"
Source = "https://github.com/bougtoir/falsesync"
Issues = "https://github.com/bougtoir/falsesync/issues"
Changelog = "https://github.com/bougtoir/falsesync/blob/main/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.23233536"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "black>=24"]
cp = ["ruptures>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
